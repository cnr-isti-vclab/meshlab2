name: Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    # A documentation-only commit cannot break packaging. paths-ignore only skips
    # the run when *every* changed file matches, so a commit touching both docs
    # and code still builds.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

# One build per branch. Pushing again while a build is in flight cancels it rather
# than queueing a second: only the newest commit is worth packaging. A run started by
# hand gets a group of its own, so a push cannot cancel a release build and two manual
# runs cannot cancel each other.
concurrency:
  group: windows-portable-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  build-portable:
    name: Build Portable ZIP
    runs-on: windows-2022
    env:
      BUILD_DIR: build-win-release
      VCPKG_ROOT_WORKSPACE: ${{ github.workspace }}\vcpkg
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\ci\vcpkg-triplets
      VCPKG_TARGET_TRIPLET: x64-windows-release
      QT_VERSION: 6.11.0
      QT_ARCH: msvc2022_64
      QT_INSTALL_DIR: ${{ github.workspace }}\Qt
      QT_PACKAGE_BASE_URL: https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6110/qt6_6110_msvc2022_64
      # qtimageformats carries the tga/tiff/webp/icns image plugins. Without it
      # QImageReader reads none of those, so a .tga texture fails to load with nothing
      # but "Unknown error" -- and windeployqt can only bundle the plugins that the Qt
      # it is pointed at actually has.
      QT_PACKAGE_NAMES: qt.qt6.6110.win64_msvc2022_64;qt.qt6.6110.addons.qtshadertools.win64_msvc2022_64;qt.qt6.6110.addons.qtimageformats.win64_msvc2022_64;qt.qt6.6110.addons.qtimageformats.win64_msvc2022_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore workspace tool roots
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_ROOT_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache Qt SDK
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: ${{ env.QT_INSTALL_DIR }}
          key: windows-qt-${{ runner.os }}-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-qtshadertools-qtimageformats-public-archives

      - name: Install Qt from public archives
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "py7zr==1.0.*"
          $scriptPath = Join-Path $env:RUNNER_TEMP "install_qt_public.py"
          @(
            'import os',
            'import pathlib',
            'import re',
            'import urllib.request',
            'import xml.etree.ElementTree as ET',
            '',
            'import py7zr',
            '',
            'base_url = os.environ["QT_PACKAGE_BASE_URL"].rstrip("/")',
            'install_dir = pathlib.Path(os.environ["QT_INSTALL_DIR"])',
            'package_names = [name for name in os.environ["QT_PACKAGE_NAMES"].split(";") if name]',
            'download_dir = install_dir / "_downloads"',
            'download_dir.mkdir(parents=True, exist_ok=True)',
            '',
            'updates_path = download_dir / "Updates.xml"',
            'print(f"Downloading metadata: {base_url}/Updates.xml")',
            'urllib.request.urlretrieve(f"{base_url}/Updates.xml", updates_path)',
            '',
            'root = ET.parse(updates_path).getroot()',
            'packages = {}',
            'for node in root.findall("./PackageUpdate"):',
            '    name = node.findtext("Name")',
            '    if name:',
            '        packages[name] = node',
            '',
            'for package_name in package_names:',
            '    if package_name not in packages:',
            '        raise RuntimeError(f"Package {package_name} not found in Updates.xml")',
            '    node = packages[package_name]',
            '    version = (node.findtext("Version") or "").strip()',
            '    archives_text = node.findtext("DownloadableArchives") or ""',
            '    archives = [item for item in re.split(r"[\s,]+", archives_text) if item]',
            '    if not version or not archives:',
            '        raise RuntimeError(f"Package {package_name} is missing version or archives metadata")',
            '',
            '    print(f"Installing {package_name}")',
            '    for archive in archives:',
            '        filename = f"{version}{archive}"',
            '        archive_url = f"{base_url}/{package_name}/{filename}"',
            '        archive_path = download_dir / filename',
            '        print(f"  download {archive_url}")',
            '        urllib.request.urlretrieve(archive_url, archive_path)',
            '        print(f"  extract {archive_path.name}")',
            '        with py7zr.SevenZipFile(archive_path, mode="r") as bundle:',
            '            bundle.extractall(path=install_dir)',
            '',
            'for path in download_dir.iterdir():',
            '    path.unlink()',
            'download_dir.rmdir()'
          ) -join "`n" | Set-Content -Path $scriptPath -Encoding utf8
          python $scriptPath

      - name: Expose Qt tools
        shell: pwsh
        run: |
          $qtConfig = Get-ChildItem $env:QT_INSTALL_DIR -Recurse -Filter Qt6Config.cmake | Select-Object -First 1
          if ($null -eq $qtConfig) {
            throw "Qt6Config.cmake not found under $env:QT_INSTALL_DIR"
          }
          $qtRootDir = Split-Path (Split-Path (Split-Path (Split-Path $qtConfig.FullName -Parent) -Parent) -Parent) -Parent
          "$qtRootDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "QT_ROOT_DIR=$qtRootDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$qtRootDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Qt6_DIR=$qtRootDir\lib\cmake\Qt6" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          $vcpkgBaseline = (Get-Content (Join-Path $env:GITHUB_WORKSPACE "vcpkg.json") | ConvertFrom-Json)."builtin-baseline"
          git -C $env:VCPKG_ROOT checkout --detach $vcpkgBaseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Restore vcpkg artifacts
        id: restore-vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\vcpkg\archives
            ${{ env.VCPKG_ROOT_WORKSPACE }}\downloads
            ${{ github.workspace }}\build-win-release\vcpkg_installed
          key: windows-portable-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ci/vcpkg-triplets/*.cmake') }}
          restore-keys: |
            windows-portable-vcpkg-${{ runner.os }}-

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $installLog = Join-Path $env:GITHUB_WORKSPACE "vcpkg-install.log"
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet "$env:VCPKG_TARGET_TRIPLET" `
            --overlay-triplets="$env:VCPKG_OVERLAY_TRIPLETS" `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --x-install-root="$env:GITHUB_WORKSPACE\$env:BUILD_DIR\vcpkg_installed" `
            --clean-after-build 2>&1 | Tee-Object -FilePath $installLog
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed with exit code $LASTEXITCODE"
          }

      # Save now rather than in a post-job hook, so a later compile/package
      # failure does not discard an otherwise successful dependency build.
      - name: Save vcpkg artifacts
        if: steps.restore-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\vcpkg\archives
            ${{ env.VCPKG_ROOT_WORKSPACE }}\downloads
            ${{ github.workspace }}\build-win-release\vcpkg_installed
          key: windows-portable-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ci/vcpkg-triplets/*.cmake') }}

      - name: Show vcpkg failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $buildtrees = Join-Path $env:VCPKG_ROOT "buildtrees"
          if (!(Test-Path $buildtrees)) {
            Write-Warning "No vcpkg buildtrees directory was produced"
            exit 0
          }

          $installLog = Join-Path $env:GITHUB_WORKSPACE "vcpkg-install.log"
          if (Test-Path $installLog) {
            Write-Host "::group::$installLog"
            Get-Content $installLog -Tail 500
            Write-Host "::endgroup::"
          }

          $logs = Get-ChildItem $buildtrees -Recurse -File |
            Where-Object { $_.Extension -in ".log", ".txt" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 12

          foreach ($log in $logs) {
            Write-Host "::group::$($log.FullName)"
            Get-Content $log.FullName -Tail 250
            Write-Host "::endgroup::"
          }

      - name: Upload vcpkg failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qmeshlab-windows-vcpkg-logs
          path: |
            ${{ github.workspace }}\vcpkg-install.log
            ${{ env.VCPKG_ROOT_WORKSPACE }}\buildtrees\**\*.log
            ${{ env.VCPKG_ROOT_WORKSPACE }}\buildtrees\**\*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset vcpkg-manifest -B $env:BUILD_DIR -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" -DQt6_DIR="$env:Qt6_DIR" -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET" -DVCPKG_OVERLAY_TRIPLETS="$env:VCPKG_OVERLAY_TRIPLETS" -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE\$env:BUILD_DIR\vcpkg_installed" -DVCPKG_MANIFEST_INSTALL=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR --parallel 4

      - name: Define release artifact name
        id: release-metadata
        shell: pwsh
        run: |
          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $artifactStem = "MeshLab-$releaseDate-$shortSha-windows-x86_64"
          "artifact_stem=$artifactStem" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create portable package
        shell: pwsh
        env:
          RELEASE_ARTIFACT_STEM: ${{ steps.release-metadata.outputs.artifact_stem }}
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR\MeshLab.exe"
          if (!(Test-Path $exePath)) {
            $exePath = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR\Release\MeshLab.exe"
          }
          if (!(Test-Path $exePath)) {
            throw "MeshLab.exe not found in build output"
          }

          $distRoot = Join-Path $env:GITHUB_WORKSPACE "dist"
          $portableDir = Join-Path $distRoot "MeshLab-portable-win64"
          Remove-Item -Recurse -Force $portableDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          Copy-Item $exePath $portableDir

          $quadWildDir = Join-Path (Split-Path $exePath -Parent) "quadwild-bimdf"
          if (!(Test-Path $quadWildDir)) {
            throw "Bundled QuadWild-BiMDF directory not found beside MeshLab.exe"
          }
          Copy-Item $quadWildDir (Join-Path $portableDir "quadwild-bimdf") -Recurse

          & windeployqt --release --compiler-runtime (Join-Path $portableDir "MeshLab.exe")

          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR\vcpkg_installed\$env:VCPKG_TARGET_TRIPLET\bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item (Join-Path $vcpkgBin "*.dll") $portableDir -Force -ErrorAction SilentlyContinue
          }

          $zipPath = Join-Path $distRoot "$env:RELEASE_ARTIFACT_STEM.zip"
          Remove-Item -Force $zipPath -ErrorAction SilentlyContinue
          Compress-Archive -Path $portableDir -DestinationPath $zipPath
          Get-ChildItem $distRoot

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release-metadata.outputs.artifact_stem }}
          path: ${{ github.workspace }}/dist/${{ steps.release-metadata.outputs.artifact_stem }}.zip
          if-no-files-found: error
          # Every push builds one of these, so they have to expire or the artifact
          # list becomes unusable. Two weeks is long enough to go back to last
          # week's build; a release worth keeping should be attached to a release.
          retention-days: 14
