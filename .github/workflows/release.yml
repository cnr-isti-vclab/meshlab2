name: Release

# A release is a tag on main named for the version (YYYY.MM, or YYYY.MM.N for a
# hotfix). The tag must match MESHLAB2_VERSION in CMakeLists.txt, so the version bump
# is an ordinary commit on devel and nothing here writes to a branch.
#
# The result is a draft GitHub Release: nothing is public until it is published by
# hand. See docs/design/release_process.md.
on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].*'

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag matches the version and sits on main
        run: |
          VERSION="$(sed -n 's/^set(MESHLAB2_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME does not match MESHLAB2_VERSION ($VERSION)" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          }

  macos:
    needs: check
    uses: ./.github/workflows/macos-dmg.yml
    with:
      release_version: ${{ github.ref_name }}
    secrets: inherit

  windows:
    needs: check
    uses: ./.github/workflows/windows-portable.yml
    with:
      release_version: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: Create draft release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: MeshLab-${{ github.ref_name }}-*
          merge-multiple: true
          path: release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "MeshLab $GITHUB_REF_NAME" \
            --generate-notes \
            --draft
