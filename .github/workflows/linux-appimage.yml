name: Linux AppImage

# Build, test, and package the result as an AppImage. See docs/design/release_process.md.
on:
  workflow_dispatch:
  # Called by release.yml with the release version; a push or manual run leaves it
  # empty and gets the date-and-commit artifact name instead.
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''
  push:
    branches: [devel]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Linux x86_64)
    # An AppImage runs on anything with a glibc and libstdc++ at least as new as the
    # ones it was built against, so the container sets the oldest Linux it supports.
    # AlmaLinux 9, glibc 2.34, is as old as it can go: the Qt binaries installed below
    # were built on RHEL 9 and need 2.34 themselves. That takes in Ubuntu 22.04, Debian
    # 12, RHEL 9 and what derives from them. GCC 13, which TextureConsolidation's helpers
    # are tested with, comes from gcc-toolset-13: it links the parts of libstdc++ newer
    # than the system's GCC 11 into the binaries, so they need no newer libstdc++ than Qt
    # does. See docs/design/release_process.md.
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 150
    env:
      # The build image, in the vcpkg and helper cache keys: what one image built does
      # not run on an older one. Change it with the container above.
      MESHLAB2_BUILD_IMAGE: almalinux9
      BUILD_DIR: build-release
      QT_VERSION: 6.11.2
      QT_ARCH: linux_gcc_64
      VCPKG_TARGET_TRIPLET: x64-linux-release
      # No window server on a runner. Right for the ctest suite, wrong for the render
      # probes, which need a GPU and are not run here -- see docs/design/rendering.md.
      QT_QPA_PLATFORM: offscreen

    steps:
      # Before the checkout, which needs git to make a repository rather than unpack a
      # tarball. The container is bare where a GitHub runner image is not, so this also
      # brings what the runner had without asking: the archivers the caches and vcpkg
      # use, perl for OpenSSL, bison and flex, fonts for the offscreen tests.
      - name: Install build dependencies
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          # The autotools are for ports vcpkg builds with configure (GMP, Python). The
          # GL/xkb/fontconfig/dbus headers are what Qt's CMake config looks for when it is
          # linked into a program. The xcb-util libraries are for linuxdeploy, which bundles
          # what libqxcb.so links to, but only those it finds here.
          dnf -y install --setopt=install_weak_deps=False \
            git zip unzip tar gzip zstd file findutils procps-ng \
            gcc-toolset-13 ninja-build cmake make pkgconf-pkg-config \
            autoconf autoconf271 autoconf-archive automake libtool perl kernel-headers \
            bison flex \
            python3 python3.12 python3.12-pip \
            mesa-libGL-devel mesa-libEGL-devel mesa-libGLU-devel mesa-dri-drivers \
            libxkbcommon-devel fontconfig-devel dbus-devel dejavu-sans-fonts \
            xcb-util-cursor xcb-util-wm xcb-util-image xcb-util-keysyms \
            xcb-util-renderutil libxkbcommon-x11
          # The checkout belongs to the runner's user and this container runs as root, so
          # git refuses to work in it, and in the submodules, unless they are marked safe.
          # actions/checkout marks it only in a home of its own, which later steps do not see.
          git config --global --add safe.directory '*'
          # In a container job the github.workspace context is the runner's path, not the one
          # mounted here, so the paths below the checkout are set from $GITHUB_WORKSPACE.
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/ci/vcpkg-triplets" >> "$GITHUB_ENV"
          # First on PATH, for CMake, vcpkg and the configure scripts alike.
          echo /opt/rh/gcc-toolset-13/root/usr/bin >> "$GITHUB_PATH"
          # vcpkg's python3 regenerates its configure script and needs Autoconf 2.71, where
          # AlmaLinux 9's own is 2.69 (automake depends on it, so it stays). autoconf271 sits
          # beside it; AUTOM4TE is for automake's aclocal, which calls autom4te itself.
          echo /opt/rh/autoconf271/bin >> "$GITHUB_PATH"
          echo "AUTOM4TE=/opt/rh/autoconf271/bin/autom4te" >> "$GITHUB_ENV"
          echo "CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc" >> "$GITHUB_ENV"
          echo "CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      # Recursively and retrying, with QuadWild's RWTH-hosted submodules from the cache.
      - name: Fetch submodules
        uses: ./.github/actions/fetch-submodules

      # aqtinstall itself rather than install-qt-action, which is made for GitHub's runner
      # images: its dependencies are apt packages, the Python it fetches is built for Ubuntu,
      # and the py7zr it pins needs a newer Python than the container's 3.9.
      - name: Restore Qt
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: /opt/qt
          key: qt-${{ env.MESHLAB2_BUILD_IMAGE }}-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-shadertools-imageformats

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3.12 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --no-cache-dir "aqtinstall==3.3.*"
          # qtimageformats carries the tga/tiff/webp image plugins; see macos-dmg.yml.
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
            --modules qtshadertools qtimageformats --outputdir /opt/qt

      - name: Expose Qt tools
        run: |
          QT_ROOT_DIR="/opt/qt/$QT_VERSION/gcc_64"
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          VCPKG_BASELINE="$(python3 - <<'PY'
          import json
          with open("vcpkg.json", "r", encoding="utf-8") as f:
              print(json.load(f)["builtin-baseline"])
          PY
          )"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # Only the binary archives are cached, not vcpkg_installed or the source
      # downloads the other platforms keep: vcpkg rebuilds the installed tree from
      # the archives in a minute or two, and the repository's cache budget (10 GB) is
      # shared with the macOS and Windows jobs. The run id makes the key unique, so
      # the entry is written only when something was actually compiled, below.
      - name: Restore vcpkg archives
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: linux-vcpkg-${{ env.MESHLAB2_BUILD_IMAGE }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'ci/vcpkg-triplets/*.cmake') }}-${{ github.run_id }}
          restore-keys: |
            linux-vcpkg-${{ env.MESHLAB2_BUILD_IMAGE }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'ci/vcpkg-triplets/*.cmake') }}-
            linux-vcpkg-${{ env.MESHLAB2_BUILD_IMAGE }}-${{ runner.arch }}-

      - name: Install vcpkg dependencies
        id: vcpkg-install
        run: |
          set -o pipefail
          # The overlay port of rapidobj: the original is marked unsupported on Linux
          # and fails vcpkg's pkg-config check there; see ci/vcpkg-ports/rapidobj.
          "$VCPKG_ROOT/vcpkg" install \
            --overlay-ports="$GITHUB_WORKSPACE/ci/vcpkg-ports" \
            --triplet "$VCPKG_TARGET_TRIPLET" \
            --overlay-triplets="$VCPKG_OVERLAY_TRIPLETS" \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --x-install-root="$GITHUB_WORKSPACE/$BUILD_DIR/vcpkg_installed" \
            --clean-after-build 2>&1 | tee "$GITHUB_WORKSPACE/vcpkg-install.log"

      # Runs even when the install failed: the ports built before the failing one are
      # in the archive directory, and on a first run they are hours of work.
      - name: Check whether vcpkg compiled anything
        id: vcpkg-built
        if: ${{ !cancelled() }}
        run: |
          if grep -q '^Building ' "$GITHUB_WORKSPACE/vcpkg-install.log"; then
            echo "rebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuilt=false" >> "$GITHUB_OUTPUT"
          fi

      # Save now rather than in a post-job hook, so a later compile failure does not
      # discard an otherwise successful dependency build.
      - name: Save vcpkg archives
        if: ${{ !cancelled() && steps.vcpkg-built.outputs.rebuilt == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: linux-vcpkg-${{ env.MESHLAB2_BUILD_IMAGE }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'ci/vcpkg-triplets/*.cmake') }}-${{ github.run_id }}

      - name: Upload vcpkg failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meshlab-linux-vcpkg-logs
          path: |
            vcpkg-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.txt
          if-no-files-found: warn
          retention-days: 7

      # Before configuring: see .github/actions/helper-cache.
      - name: Restore the helper programs
        uses: ./.github/actions/helper-cache
        with:
          mode: restore

      - name: Configure
        run: |
          cmake --preset vcpkg-manifest \
            -B "$BUILD_DIR" \
            -DMESHLAB2_RELEASE_BUILD=${{ inputs.release_version && 'ON' || 'OFF' }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_OVERLAY_TRIPLETS="$VCPKG_OVERLAY_TRIPLETS" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/$BUILD_DIR/vcpkg_installed" \
            -DVCPKG_MANIFEST_INSTALL=OFF

      - name: Build
        run: |
          # The helper sets first, on their own: MeshLab's heaviest translation units, four
          # at a time, take nearly all of the runner's 16 GB by themselves (14.7 GB at the
          # peak, measured 2026-11-09), so a helper set building beside them runs it out of
          # memory, which the runner reports only as exit 137. A set restored from the cache
          # has no target, hence the lookup. The nested builds read CMAKE_BUILD_PARALLEL_LEVEL.
          helpers="$(ninja -C "$BUILD_DIR" -t targets all | grep -o '^MeshLab2[A-Za-z]*Helpers' | sort -u)"
          if [ -n "$helpers" ]; then
            CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)" cmake --build "$BUILD_DIR" --target $helpers
          fi
          cmake --build "$BUILD_DIR" -j"$(nproc)"

      - name: Save the helper programs
        if: ${{ !cancelled() }}
        uses: ./.github/actions/helper-cache
        with:
          mode: save

      - name: Run ctest
        run: |
          cd "$BUILD_DIR"
          # --no-tests=error so a configuration that registers nothing fails loudly
          # instead of reporting a green run with zero tests. The large datasets are
          # not fetched: tests that need them skip when they are absent.
          ctest --output-on-failure --no-tests=error

      # Pinned releases, checked against their SHA-256: the continuous builds move.
      - name: Download linuxdeploy
        run: |
          mkdir -p "$RUNNER_TEMP/linuxdeploy"
          cd "$RUNNER_TEMP/linuxdeploy"
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c - <<'SUMS'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage
          SUMS
          chmod +x ./*.AppImage

      - name: Define release artifact name
        id: release-metadata
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            STEM="MeshLab-$RELEASE_VERSION-linux-x86_64"
          else
            STEM="MeshLab-$(date -u +%Y-%m-%d)-${GITHUB_SHA:0:8}-linux-x86_64"
          fi
          echo "artifact_stem=$STEM" >> "$GITHUB_OUTPUT"

      - name: Package AppImage
        env:
          RELEASE_ARTIFACT_STEM: ${{ steps.release-metadata.outputs.artifact_stem }}
        run: |
          ./scripts/package-linux-appimage.sh \
            --build-dir "$BUILD_DIR" \
            --linuxdeploy "$RUNNER_TEMP/linuxdeploy/linuxdeploy-x86_64.AppImage" \
            --output "$BUILD_DIR/$RELEASE_ARTIFACT_STEM.AppImage"

      # What can be checked without a display: nothing the executables need is left
      # unresolved, and the bundled interpreter, Qt and libraries start (the documentation
      # generator imports the Python standard library and the _meshlab module, offscreen).
      - name: Smoke-test the AppImage
        env:
          RELEASE_ARTIFACT_STEM: ${{ steps.release-metadata.outputs.artifact_stem }}
        run: |
          cd "$BUILD_DIR"
          chmod +x "$RELEASE_ARTIFACT_STEM.AppImage"
          "./$RELEASE_ARTIFACT_STEM.AppImage" --appimage-extract > /dev/null
          for exe in squashfs-root/usr/bin/MeshLab squashfs-root/usr/bin/*/bin/*; do
            if ldd "$exe" | grep "not found"; then
              echo "$exe has unresolved libraries" >&2
              exit 1
            fi
          done
          cp -r "$GITHUB_WORKSPACE/docs" "$RUNNER_TEMP/docs-smoke"
          QT_QPA_PLATFORM=offscreen squashfs-root/AppRun --generate-docs "$RUNNER_TEMP/docs-smoke"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release-metadata.outputs.artifact_stem }}
          path: ${{ env.BUILD_DIR }}/${{ steps.release-metadata.outputs.artifact_stem }}.AppImage
          if-no-files-found: error
          # Every push builds one of these; see macos-dmg.yml.
          retention-days: 14

      # QtTest names the test function that crashed but not where, and a runner cannot
      # be attached to; gcc-toolset-13 brings gdb. The binaries are not stripped, so the backtrace has function
      # names; -g1 would add line numbers but made the build run out of resources.
      - name: Backtrace of failed tests
        if: failure()
        run: |
          cd "$BUILD_DIR"
          for t in $(sed 's/^[0-9]*://' Testing/Temporary/LastTestsFailed.log); do
            exe="$(ctest -R "^${t}$" --show-only=json-v1 |
              python3 -c "import json,sys; print(json.load(sys.stdin)['tests'][0]['command'][0])")"
            echo "::group::gdb $t"
            gdb -batch -iex "set print thread-events off" -ex run -ex "x/6i \$pc" \
                -ex "info registers" -ex "bt 30" --args "$exe" -silent || true
            echo "::endgroup::"
          done

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-ctest-logs
          path: ${{ env.BUILD_DIR }}/Testing/
          retention-days: 7
          if-no-files-found: ignore
