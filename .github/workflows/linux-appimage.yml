name: Linux AppImage

# Build, test, and package the result as an AppImage. See docs/design/release_process.md.
on:
  workflow_dispatch:
  # Called by release.yml with the release version; a push or manual run leaves it
  # empty and gets the date-and-commit artifact name instead.
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''
  push:
    branches: [devel]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Linux x86_64)
    # An AppImage runs on anything with a glibc and libstdc++ at least as new as the
    # ones it was built against, so this image sets the oldest Linux it supports. 24.04,
    # not 22.04: its GCC 13 is what TextureConsolidation's helpers are tested with, and
    # 22.04 leaves standard support in April 2027. See docs/design/release_process.md.
    # The image is also in the vcpkg cache key below; change both together.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BUILD_DIR: build-release
      QT_VERSION: 6.11.2
      QT_ARCH: linux_gcc_64
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_TARGET_TRIPLET: x64-linux-release
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/ci/vcpkg-triplets
      # No window server on a runner. Right for the ctest suite, wrong for the render
      # probes, which need a GPU and are not run here -- see docs/design/rendering.md.
      QT_QPA_PLATFORM: offscreen

    steps:
      # QuadWild's own submodules (OpenMesh, CoMISo, cmake-library) still point at
      # www.graphics.rwth-aachen.de:9000, which is gone. The same repositories, at the same
      # commits, are served by RWTH's GitLab; rewrite the URL for git before the checkout
      # fetches them. Remove this once the cgg-bern fork updates its .gitmodules.
      - name: Use RWTH's new git host
        run: git config --global "url.https://gitlab.vci.rwth-aachen.de:9000/.insteadOf" "https://www.graphics.rwth-aachen.de:9000/"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          # The autotools are for ports vcpkg builds with configure (GMP, Python).
          # The GL/xkb/fontconfig/dbus headers are what Qt's CMake config looks for
          # when it is linked into a program.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            autoconf autoconf-archive automake libtool \
            libgl1-mesa-dev libegl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-dev libfontconfig1-dev libdbus-1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: ${{ env.QT_ARCH }}
          # qtimageformats carries the tga/tiff/webp image plugins; see macos-dmg.yml.
          modules: qtshadertools qtimageformats
          cache: true
          cache-key-prefix: meshlab-qt-linux-imgfmt

      - name: Expose Qt tools
        run: |
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          VCPKG_BASELINE="$(python3 - <<'PY'
          import json
          with open("vcpkg.json", "r", encoding="utf-8") as f:
              print(json.load(f)["builtin-baseline"])
          PY
          )"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # Only the binary archives are cached, not vcpkg_installed or the source
      # downloads the other platforms keep: vcpkg rebuilds the installed tree from
      # the archives in a minute or two, and the repository's cache budget (10 GB) is
      # shared with the macOS and Windows jobs. The run id makes the key unique, so
      # the entry is written only when something was actually compiled, below.
      - name: Restore vcpkg archives
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: linux-vcpkg-ubuntu24-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'ci/vcpkg-triplets/*.cmake') }}-${{ github.run_id }}
          restore-keys: |
            linux-vcpkg-ubuntu24-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'ci/vcpkg-triplets/*.cmake') }}-
            linux-vcpkg-ubuntu24-${{ runner.arch }}-

      - name: Install vcpkg dependencies
        id: vcpkg-install
        run: |
          set -o pipefail
          # The overlay port of rapidobj: the original is marked unsupported on Linux
          # and fails vcpkg's pkg-config check there; see ci/vcpkg-ports/rapidobj.
          "$VCPKG_ROOT/vcpkg" install \
            --overlay-ports="$GITHUB_WORKSPACE/ci/vcpkg-ports" \
            --triplet "$VCPKG_TARGET_TRIPLET" \
            --overlay-triplets="$VCPKG_OVERLAY_TRIPLETS" \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --x-install-root="$GITHUB_WORKSPACE/$BUILD_DIR/vcpkg_installed" \
            --clean-after-build 2>&1 | tee "$GITHUB_WORKSPACE/vcpkg-install.log"

      # Runs even when the install failed: the ports built before the failing one are
      # in the archive directory, and on a first run they are hours of work.
      - name: Check whether vcpkg compiled anything
        id: vcpkg-built
        if: ${{ !cancelled() }}
        run: |
          if grep -q '^Building ' "$GITHUB_WORKSPACE/vcpkg-install.log"; then
            echo "rebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuilt=false" >> "$GITHUB_OUTPUT"
          fi

      # Save now rather than in a post-job hook, so a later compile failure does not
      # discard an otherwise successful dependency build.
      - name: Save vcpkg archives
        if: ${{ !cancelled() && steps.vcpkg-built.outputs.rebuilt == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: linux-vcpkg-ubuntu24-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'ci/vcpkg-triplets/*.cmake') }}-${{ github.run_id }}

      - name: Upload vcpkg failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meshlab-linux-vcpkg-logs
          path: |
            ${{ github.workspace }}/vcpkg-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Configure
        run: |
          cmake --preset vcpkg-manifest \
            -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_OVERLAY_TRIPLETS="$VCPKG_OVERLAY_TRIPLETS" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/$BUILD_DIR/vcpkg_installed" \
            -DVCPKG_MANIFEST_INSTALL=OFF

      - name: Build
        run: cmake --build "$BUILD_DIR" -j"$(nproc)"

      - name: Run ctest
        run: |
          cd "$BUILD_DIR"
          # --no-tests=error so a configuration that registers nothing fails loudly
          # instead of reporting a green run with zero tests. The large datasets are
          # not fetched: tests that need them skip when they are absent.
          ctest --output-on-failure --no-tests=error

      # linuxdeploy bundles the libraries libqxcb.so links to, but only those it finds here.
      - name: Install AppImage runtime libraries
        run: |
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      # Pinned releases, checked against their SHA-256: the continuous builds move.
      - name: Download linuxdeploy
        run: |
          mkdir -p "$RUNNER_TEMP/linuxdeploy"
          cd "$RUNNER_TEMP/linuxdeploy"
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c - <<'SUMS'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage
          SUMS
          chmod +x ./*.AppImage

      - name: Define release artifact name
        id: release-metadata
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            STEM="MeshLab-$RELEASE_VERSION-linux-x86_64"
          else
            STEM="MeshLab-$(date -u +%Y-%m-%d)-${GITHUB_SHA:0:8}-linux-x86_64"
          fi
          echo "artifact_stem=$STEM" >> "$GITHUB_OUTPUT"

      - name: Package AppImage
        env:
          RELEASE_ARTIFACT_STEM: ${{ steps.release-metadata.outputs.artifact_stem }}
        run: |
          ./scripts/package-linux-appimage.sh \
            --build-dir "$BUILD_DIR" \
            --linuxdeploy "$RUNNER_TEMP/linuxdeploy/linuxdeploy-x86_64.AppImage" \
            --output "$BUILD_DIR/$RELEASE_ARTIFACT_STEM.AppImage"

      # What can be checked without a display: nothing the executables need is left
      # unresolved, and the bundled interpreter, Qt and libraries start (the documentation
      # generator imports the Python standard library and the _meshlab module, offscreen).
      - name: Smoke-test the AppImage
        env:
          RELEASE_ARTIFACT_STEM: ${{ steps.release-metadata.outputs.artifact_stem }}
        run: |
          # The Qt install action points these at the runner's own Qt; with them set, both
          # checks below would pass by borrowing it, and prove nothing about the bundle.
          unset LD_LIBRARY_PATH QT_ROOT_DIR
          cd "$BUILD_DIR"
          chmod +x "$RELEASE_ARTIFACT_STEM.AppImage"
          "./$RELEASE_ARTIFACT_STEM.AppImage" --appimage-extract > /dev/null
          for exe in squashfs-root/usr/bin/MeshLab \
                     squashfs-root/usr/bin/quadwild-bimdf/bin/quadwild \
                     squashfs-root/usr/bin/quadwild-bimdf/bin/quad_from_patches; do
            if ldd "$exe" | grep "not found"; then
              echo "$exe has unresolved libraries" >&2
              exit 1
            fi
          done
          cp -r "$GITHUB_WORKSPACE/docs" "$RUNNER_TEMP/docs-smoke"
          QT_QPA_PLATFORM=offscreen squashfs-root/AppRun --generate-docs "$RUNNER_TEMP/docs-smoke"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release-metadata.outputs.artifact_stem }}
          path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/${{ steps.release-metadata.outputs.artifact_stem }}.AppImage
          if-no-files-found: error
          # Every push builds one of these; see macos-dmg.yml.
          retention-days: 14

      # QtTest names the test function that crashed but not where, and a runner cannot
      # be attached to. The binaries are not stripped, so the backtrace has function
      # names; -g1 would add line numbers but made the build run out of resources.
      - name: Backtrace of failed tests
        if: failure()
        run: |
          sudo apt-get install -y --no-install-recommends gdb
          cd "$BUILD_DIR"
          for t in $(sed 's/^[0-9]*://' Testing/Temporary/LastTestsFailed.log); do
            exe="$(ctest -R "^${t}$" --show-only=json-v1 |
              python3 -c "import json,sys; print(json.load(sys.stdin)['tests'][0]['command'][0])")"
            echo "::group::gdb $t"
            gdb -batch -iex "set print thread-events off" -ex run -ex "x/6i \$pc" \
                -ex "info registers" -ex "bt 30" --args "$exe" -silent || true
            echo "::endgroup::"
          done

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-ctest-logs
          path: ${{ env.BUILD_DIR }}/Testing/
          retention-days: 7
          if-no-files-found: ignore
