name: Documentation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools

      - name: Install Python dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Install native dependencies
        run: brew install eigen tbb glm

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQMESH_REQUIRE_VCPKG_DEPS=OFF \
            -DQMESH_MACOS_BUNDLE_ICON=OFF \
            -DQMESHLAB_PYTHON_CONSOLE=ON \
            -Dnanobind_DIR="$(python -m nanobind --cmake_dir)" \
            -DQMESH_PLUGIN_OBJ_RAPIDOBJ=OFF \
            -DQMESH_PLUGIN_E57=OFF \
            -DQMESH_PLUGIN_GLTF=OFF \
            -DQMESH_PLUGIN_FILTER_EXPRESSION=OFF \
            -DQMESH_PLUGIN_FILTER_EMBREE=OFF
          cmake --build build --target MeshLab2 -j4

      - name: Generate API documentation
        run: |
          QT_QPA_PLATFORM=offscreen \
          ./build/QMeshLab.app/Contents/MacOS/QMeshLab \
            --generate-docs docs

      - name: Build Sphinx site
        run: sphinx-build docs docs_build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs_build
